name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      # Use pip-based install in CI (conda takes too long to solve on runners).
      # pycolmap ships manylinux wheels so pip works fine here.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy src/gf4
        # Non-blocking for now — pycolmap has no stubs and student TODOs
        # raise NotImplementedError. Promote to a hard failure once the
        # codebase is complete.
        continue-on-error: true

      - name: Run tests
        run: pytest -q
