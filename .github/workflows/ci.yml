name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Smoke test — package imports
        run: python -c "import gf4.week1; import gf4.week2"

      - name: Run tests
        run: |
          if [ -d tests ]; then
            pytest; code=$?
            # exit 5 = "no tests collected" — not a failure
            [ "$code" -eq 5 ] && exit 0 || exit "$code"
          else
            echo "No tests/ directory yet — skipping"
          fi
