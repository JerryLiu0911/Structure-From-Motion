[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "structure-from-motion"
version = "0.1.0"
description = "GF4 Structure from Motion — COLMAP + custom SfM pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "matplotlib>=3.8",
    "pycolmap>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
sfm-week1 = "gf4.week1.test:main"
sfm-week2 = "gf4.week2.week2_pipeline:main"

# src layout — tells hatchling where the package lives
[tool.hatch.build.targets.wheel]
packages = ["src/gf4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
