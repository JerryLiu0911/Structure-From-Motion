[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "structure-from-motion"
version = "0.1.0"
description = "GF4 Structure from Motion — COLMAP + custom SfM pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "matplotlib>=3.8",
    "pycolmap>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3",
]

[project.scripts]
sfm = "main:main"

# --------------------------------------------------------------------------- #
# Package discovery — src layout
# --------------------------------------------------------------------------- #
[tool.hatch.build.targets.wheel]
packages = ["src/gf4"]

# --------------------------------------------------------------------------- #
# Ruff — linting & formatting
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "B",   # flake8-bugbear
]
ignore = [
    "N806",  # allow uppercase variable names (common in CV/math code, e.g. F, K, R, T)
    "N803",  # allow uppercase argument names
]

[tool.ruff.lint.isort]
known-first-party = ["gf4"]

# --------------------------------------------------------------------------- #
# Mypy — type checking
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true   # pycolmap stubs not available
warn_return_any = true
warn_unused_ignores = true

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
