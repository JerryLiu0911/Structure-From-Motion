name: gf4-sfm

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.13

  # Core scientific stack
  - numpy>=1.26
  - matplotlib>=3.8

  # OpenCV (conda-forge build includes SIFT)
  - opencv>=4.9

  # pip-only packages
  - pip
  - pip:
      - pycolmap>=0.6
      - pytest>=8        # run tests with: pytest
      - ruff>=0.4        # lint/format with: ruff check . / ruff format .
