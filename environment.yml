name: gf4-sfm

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.13

  # Core scientific stack
  - numpy>=1.26
  - matplotlib>=3.8

  # OpenCV (conda-forge build includes SIFT)
  - opencv>=4.9

  # pip-only packages
  - pip
  - pip:
      - pycolmap>=0.6
      - pyvista>=0.44    # Week 4 point-cloud viewer (Open3D has no py3.13 wheel)
      - opencv-stubs     # type stubs for cv2 (fixes Pylance "unresolved import")
      - ruff>=0.4        # lint/format: ruff check . / ruff format .
      - pre-commit>=3    # install hooks once after cloning: pre-commit install
      - pytest>=8        # run your tests with: pytest
